environment: development

server:
  host: 0.0.0.0
  port: 8800
  cors-origins:
    - http://127.0.0.1:5173
    - http://localhost:5173

database:
  url: mysql+pymysql://token_tide:replace-me@127.0.0.1:3306/token_tide?charset=utf8mb4

http:
  timeout-seconds: 15

token-usage:
  auth-token: replace-with-a-long-random-token

refresh:
  # 标准五段 cron；示例为每小时整点刷新。
  cron: "0 * * * *"
  timezone: Asia/Shanghai

providers:
  # 可只列出需要优先展示的平台；其余已启用平台按默认顺序追加。
  order:
    - openrouter
    - deepseek
    - siliconflow
    - xai
    - opencode
  openrouter:
    enabled: false
    api-key: ""
    base-url: https://openrouter.ai
    proxy-url: null
  deepseek:
    enabled: false
    api-key: ""
    base-url: https://api.deepseek.com
    proxy-url: null
  siliconflow:
    enabled: false
    api-key: ""
    base-url: https://api.siliconflow.com
    proxy-url: null
  xai:
    enabled: false
    api-key: ""
    base-url: https://management-api.x.ai
    # 可选，例如：http://127.0.0.1:3128
    proxy-url: null
    team-id: ""
  # 实验性接入：依赖 OpenCode Web Dashboard 内部接口。
  opencode:
    enabled: false
    # 支持 Cookie value、单枚 auth Cookie 或包含 auth 的完整 Cookie Header。
    auth-cookie: ""
    workspace-id: ""
    base-url: https://opencode.ai
    proxy-url: null
