environment: development

server:
  host: 0.0.0.0
  port: 8800
  cors-origins:
    - http://127.0.0.1:5173
    - http://localhost:5173

database:
  url: mysql+pymysql://token_tide:replace-me@127.0.0.1:3306/token_tide?charset=utf8mb4

http:
  timeout-seconds: 15

refresh:
  # 标准五段 cron；示例为每小时整点刷新。
  cron: "0 * * * *"
  timezone: Asia/Shanghai

providers:
  openrouter:
    enabled: false
    api-key: ""
    base-url: https://openrouter.ai
  deepseek:
    enabled: false
    api-key: ""
    base-url: https://api.deepseek.com
  siliconflow:
    enabled: false
    api-key: ""
    base-url: https://api.siliconflow.com
  xai:
    enabled: false
    api-key: ""
    base-url: https://management-api.x.ai
    team-id: ""
