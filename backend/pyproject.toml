[project]
name = "token-tide"
version = "0.1.0"
description = "Unified dashboard API for AI platform balances"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pymysql[rsa]>=1.1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[project.scripts]
token-tide = "token_tide.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["token_tide"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
